<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Doctor Appointment Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #eef3f4;
            --card: #fff;
            --ink: #12292f;
            --mute: #5d747a;
            --line: #d3e0e3;
            --accent: #0f766e;
            --accent-ink: #fff;
            --soft: #d9efec;
            --bad: #b42318;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }
        
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d1b1f;
                --card: #14272c;
                --ink: #e6f1f2;
                --mute: #8fa8ad;
                --line: #254148;
                --accent: #3cc4b4;
                --accent-ink: #06201d;
                --soft: #173b3a;
                --bad: #ff8a7a
            }
        }
        
        :root[data-theme="dark"] {
            --bg: #0d1b1f;
            --card: #14272c;
            --ink: #e6f1f2;
            --mute: #8fa8ad;
            --line: #254148;
            --accent: #3cc4b4;
            --accent-ink: #06201d;
            --soft: #173b3a;
            --bad: #ff8a7a
        }
        
        * {
            box-sizing: border-box
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            line-height: 1.5
        }
        
        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 16px 60px
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px
        }
        
        h1 {
            font-size: 1.6rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -.02em
        }
        
        nav {
            display: flex;
            gap: 4px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px
        }
        
        nav button {
            border: 0;
            background: none;
            color: var(--mute);
            font: inherit;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer
        }
        
        nav button.on {
            background: var(--accent);
            color: var(--accent-ink)
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px
        }
        
        h2 {
            font-size: 1.05rem;
            margin: 0 0 12px
        }
        
        .docs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px
        }
        
        .doc {
            text-align: left;
            border: 1.5px solid var(--line);
            background: none;
            color: inherit;
            font: inherit;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer
        }
        
        .doc b {
            display: block;
            font-size: 1.02rem
        }
        
        .doc .sp {
            color: var(--accent);
            font-weight: 600;
            font-size: .88rem
        }
        
        .doc .fee {
            display: inline-block;
            margin: 6px 0 2px;
            background: var(--soft);
            border-radius: 999px;
            padding: 2px 10px;
            font-weight: 600;
            font-size: .9rem
        }
        
        .doc small {
            display: block;
            color: var(--mute)
        }
        
        .doc.on,
        .slot.on {
            border-color: var(--accent);
            background: var(--soft)
        }
        
        .dates {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px
        }
        
        .date {
            flex: 0 0 64px;
            text-align: center;
            border: 1.5px solid var(--line);
            background: none;
            color: inherit;
            font: inherit;
            border-radius: 12px;
            padding: 8px 0;
            cursor: pointer
        }
        
        .date small {
            display: block;
            color: var(--mute)
        }
        
        .date strong {
            font-size: 1.2rem
        }
        
        .date.on {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-ink)
        }
        
        .date.on small {
            color: inherit
        }
        
        .date:disabled {
            opacity: .35;
            cursor: not-allowed
        }
        
        .slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 8px
        }
        
        .slot {
            border: 1.5px solid var(--line);
            background: none;
            color: inherit;
            font: inherit;
            border-radius: 10px;
            padding: 9px 0;
            cursor: pointer
        }
        
        .slot:disabled {
            opacity: .35;
            text-decoration: line-through;
            cursor: not-allowed
        }
        
        label {
            display: block;
            font-weight: 600;
            font-size: .9rem;
            margin: 10px 0 4px
        }
        
        input,
        textarea,
        select {
            width: 100%;
            font: inherit;
            color: inherit;
            background: var(--bg);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: 10px
        }
        
        .ph {
            display: flex;
            gap: 8px;
            align-items: center
        }
        
        .ph span {
            font-weight: 600;
            color: var(--mute)
        }
        
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px
        }
        
        .btn {
            background: var(--accent);
            color: var(--accent-ink);
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 600;
            padding: 11px 20px;
            cursor: pointer;
            margin-top: 14px
        }
        
        .btn.ghost {
            background: none;
            color: var(--bad);
            border: 1.5px solid var(--line);
            margin: 0;
            padding: 6px 12px
        }
        
        .err {
            color: var(--bad);
            font-size: .9rem;
            min-height: 1.2em;
            margin-top: 8px
        }
        
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line)
        }
        
        .row:last-child {
            border: 0
        }
        
        .row small {
            color: var(--mute)
        }
        
        .empty {
            color: var(--mute);
            padding: 8px 0
        }
        
        .summary {
            background: var(--soft);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 12px
        }
        
        .ok {
            background: var(--soft);
            border: 1.5px solid var(--accent);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px
        }
        
        .hidden {
            display: none
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>Book a doctor appointment</h1>
            <nav aria-label="Sections">
                <button id="t-book" class="on">Book</button>
                <button id="t-mine">My bookings</button>
                <button id="t-admin">Admin</button>
            </nav>
        </header>

        <section id="v-book">
            <div id="confirm"></div>
            <div class="card">
                <h2>1. Choose a doctor</h2>
                <div class="docs" id="docs"></div>
            </div>
            <div class="card">
                <h2>2. Pick a date</h2>
                <div class="dates" id="dates"></div>
                <div class="empty" id="dateHint">Choose a doctor first.</div>
            </div>
            <div class="card">
                <h2>3. Pick a time</h2>
                <div class="slots" id="slots"></div>
                <div class="empty" id="slotHint">Choose a doctor and date to see available times.</div>
            </div>
            <div class="card">
                <h2>4. Patient details</h2>
                <label for="name">Patient name</label><input id="name" autocomplete="name">
                <label for="age">Age</label><input id="age" type="number" min="0" max="120" inputmode="numeric">
                <label for="phone">Mobile number</label>
                <div class="ph"><span>+91</span><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel-national"></div>
                <label for="note">Reason for visit (optional)</label><textarea id="note" rows="2"></textarea>
                <div class="summary hidden" id="summary"></div>
                <div class="err" id="err" role="alert"></div>
                <button class="btn" id="submit">Confirm booking</button>
            </div>
        </section>

        <section id="v-mine" class="hidden">
            <div class="card">
                <h2>Find your bookings</h2>
                <label for="lookup">Mobile number used when booking</label>
                <div class="ph"><span>+91</span><input id="lookup" type="tel" inputmode="numeric" maxlength="10"></div>
                <button class="btn" id="find">Show bookings</button>
                <div id="mineList" style="margin-top:12px"></div>
            </div>
        </section>

        <section id="v-admin" class="hidden">
            <div class="card" id="login">
                <h2>Admin sign in</h2>
                <label for="pin">PIN (demo PIN: 1234)</label>
                <input id="pin" type="password" inputmode="numeric">
                <div class="err" id="pinErr"></div>
                <button class="btn" id="enter">Sign in</button>
            </div>
            <div class="card hidden" id="panel">
                <h2>All bookings</h2>
                <label for="fDoc">Doctor</label>
                <select id="fDoc"></select>
                <label for="sortBy">Arrange by</label>
                <select id="sortBy">
      <option value="placedDesc">Booking placed: newest first</option>
      <option value="placedAsc">Booking placed: oldest first</option>
      <option value="apptAsc">Appointment time: soonest first</option>
    </select>
                <div id="adminList" style="margin-top:8px"></div>
                <button class="btn ghost" id="wipe" style="margin-top:14px">Delete all bookings</button>
            </div>
        </section>
    </div>

    <script>
        /* ---------- Config: edit doctors here. days: 0=Sun ... 6=Sat. hours in 24h "HH:MM" ---------- */
        const DOCTORS = [{
            id: 'd1',
            name: 'Dr. Anil Sharma',
            spec: 'General Physician',
            fee: 500,
            days: [1, 2, 3, 4, 5, 6],
            win: [
                ['10:00', '13:00'],
                ['17:00', '20:00']
            ],
            slot: 15
        }, {
            id: 'd2',
            name: 'Dr. Priya Mukherjee',
            spec: 'Gynaecologist',
            fee: 800,
            days: [1, 3, 5],
            win: [
                ['10:00', '14:00']
            ],
            slot: 20
        }, {
            id: 'd3',
            name: 'Dr. Rajesh Gupta',
            spec: 'Cardiologist',
            fee: 1000,
            days: [2, 4, 6],
            win: [
                ['11:00', '15:00']
            ],
            slot: 20
        }, {
            id: 'd4',
            name: 'Dr. Sneha Das',
            spec: 'Paediatrician',
            fee: 600,
            days: [1, 2, 3, 4, 5, 6],
            win: [
                ['16:00', '20:00']
            ],
            slot: 15
        }, {
            id: 'd5',
            name: 'Dr. Amit Roy',
            spec: 'Orthopaedic',
            fee: 700,
            days: [1, 2, 3, 4, 5],
            win: [
                ['09:30', '12:30']
            ],
            slot: 20
        }];
        const DAYS_AHEAD = 21,
            ADMIN_PIN = '1234',
            KEY = 'appt_bookings_v2';
        const DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        /* ---------- Storage ---------- */
        let mem = [];
        const load = () => {
            try {
                const r = localStorage.getItem(KEY);
                return r ? JSON.parse(r) : mem
            } catch (e) {
                return mem
            }
        };
        const save = l => {
            mem = l;
            try {
                localStorage.setItem(KEY, JSON.stringify(l))
            } catch (e) {}
        };

        /* ---------- Helpers ---------- */
        const $ = id => document.getElementById(id);
        const pad = n => String(n).padStart(2, '0');
        const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        const mins = s => {
            const [h, m] = s.split(':').map(Number);
            return h * 60 + m
        };
        const fmt = m => {
            const h = Math.floor(m / 60),
                ap = h >= 12 ? 'PM' : 'AM';
            return `${h%12||12}:${pad(m%60)} ${ap}`
        };
        const rupee = n => '₹' + n.toLocaleString('en-IN');
        const esc = s => String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));
        const docOf = id => DOCTORS.find(d => d.id === id);
        const longDate = s => new Date(s + 'T00:00').toLocaleDateString('en-IN', {
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        });
        const daysText = d => d.days.length === 6 && !d.days.includes(0) ? 'Mon–Sat' : d.days.map(x => DN[x]).join(', ');
        const timesText = d => d.win.map(w => `${fmt(mins(w[0]))} – ${fmt(mins(w[1]))}`).join(' & ');
        const st = {
            doc: null,
            date: null,
            time: null
        };

        /* ---------- Availability ---------- */
        const isTaken = (docId, date, start) => load().some(b => b.doctor === docId && b.date === date && b.start === start);
        const nowMinutes = date => {
            const n = new Date();
            return iso(n) === date ? n.getHours() * 60 + n.getMinutes() : -1
        };

        function slotsFor(d) {
            const out = [];
            d.win.forEach(w => {
                for (let t = mins(w[0]); t + d.slot <= mins(w[1]); t += d.slot) out.push(t)
            });
            return out;
        }

        /* ---------- Render: booking ---------- */
        function renderDocs() {
            $('docs').innerHTML = DOCTORS.map(d => `<button class="doc ${st.doc===d.id?'on':''}" data-id="${d.id}">
    <b>${d.name}</b><span class="sp">${d.spec}</span><br>
    <span class="fee">Fee ${rupee(d.fee)}</span>
    <small>${daysText(d)}</small><small>${timesText(d)}</small></button>`).join('');
            $('docs').querySelectorAll('button').forEach(b => b.onclick = () => {
                st.doc = b.dataset.id;
                st.time = null;
                const d = docOf(st.doc);
                if (st.date && !d.days.includes(new Date(st.date + 'T00:00').getDay())) st.date = null;
                renderDocs();
                renderDates();
                renderSlots();
                renderSummary();
            });
        }

        function renderDates() {
            const box = $('dates');
            if (!st.doc) {
                box.innerHTML = '';
                $('dateHint').style.display = '';
                return
            }
            $('dateHint').style.display = 'none';
            const d0 = docOf(st.doc),
                base = new Date();
            base.setHours(0, 0, 0, 0);
            let html = '';
            for (let i = 0; i < DAYS_AHEAD; i++) {
                const x = new Date(base);
                x.setDate(base.getDate() + i);
                const off = !d0.days.includes(x.getDay());
                html += `<button class="date ${st.date===iso(x)?'on':''}" data-d="${iso(x)}" ${off?'disabled title="Doctor not available"':''}><small>${DN[x.getDay()]}</small><strong>${x.getDate()}</strong><small>${x.toLocaleDateString('en-IN',{month:'short'})}</small></button>`;
            }
            box.innerHTML = html;
            box.querySelectorAll('button:not(:disabled)').forEach(b => b.onclick = () => {
                st.date = b.dataset.d;
                st.time = null;
                renderDates();
                renderSlots();
                renderSummary()
            });
        }

        function renderSlots() {
            const box = $('slots');
            if (!st.doc || !st.date) {
                box.innerHTML = '';
                $('slotHint').style.display = '';
                return
            }
            $('slotHint').style.display = 'none';
            const d = docOf(st.doc),
                now = nowMinutes(st.date);
            box.innerHTML = slotsFor(d).map(t => {
                const off = isTaken(d.id, st.date, t) || t <= now;
                return `<button class="slot ${st.time===t?'on':''}" data-t="${t}" ${off?'disabled':''}>${fmt(t)}</button>`
            }).join('');
            box.querySelectorAll('button:not(:disabled)').forEach(b => b.onclick = () => {
                st.time = +b.dataset.t;
                renderSlots();
                renderSummary()
            });
        }

        function renderSummary() {
            const el = $('summary');
            if (st.doc && st.date && st.time != null) {
                const d = docOf(st.doc);
                el.classList.remove('hidden');
                el.innerHTML = `<b>${d.name}</b> (${d.spec})<br>${longDate(st.date)}, ${fmt(st.time)}<br>Consultation fee: <b>${rupee(d.fee)}</b> (pay at the clinic)`;
            } else el.classList.add('hidden');
        }

        /* ---------- Submit ---------- */
        $('submit').onclick = () => {
            const name = $('name').value.trim(),
                age = $('age').value.trim(),
                phone = $('phone').value.trim();
            const err = m => {
                $('err').textContent = m
            };
            if (!st.doc) return err('Choose a doctor.');
            if (!st.date) return err('Pick a date.');
            if (st.time == null) return err('Pick a time.');
            if (name.length < 2) return err('Enter the patient name.');
            if (!age || +age < 0 || +age > 120) return err('Enter a valid age.');
            if (!/^[6-9]\d{9}$/.test(phone)) return err('Enter a valid 10-digit Indian mobile number.');
            if (isTaken(st.doc, st.date, st.time)) {
                renderSlots();
                return err('That slot was just taken. Pick another.')
            }
            const b = {
                id: 'B' + Date.now().toString(36).toUpperCase(),
                doctor: st.doc,
                date: st.date,
                start: st.time,
                name,
                age,
                phone,
                note: $('note').value.trim(),
                created: Date.now()
            };
            const l = load();
            l.push(b);
            save(l);
            err('');
            const d = docOf(b.doctor);
            $('confirm').innerHTML = `<div class="ok" role="status"><b>Booking confirmed, ${esc(name)}.</b><br>${d.name} (${d.spec}) on ${longDate(b.date)} at ${fmt(b.start)}.<br>Fee: ${rupee(d.fee)}. Reference: <b>${b.id}</b>.<br>To view or cancel, use My bookings with +91 ${esc(phone)}.</div>`;
            st.time = null;
            ['name', 'age', 'phone', 'note'].forEach(i => $(i).value = '');
            renderSlots();
            renderSummary();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };

        /* ---------- Lists ---------- */
        function rowHtml(b, admin) {
            const d = docOf(b.doctor);
            return `<div class="row"><div><b>${d.name}</b> · ${longDate(b.date)}, ${fmt(b.start)}<br><small>${admin?esc(b.name)+', '+esc(b.age)+' yrs · +91 '+esc(b.phone)+(b.note?' · '+esc(b.note):'')+' · ':''}${rupee(d.fee)} · Ref ${b.id}${admin?'<br>Placed '+new Date(b.created).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):''}</small></div><button class="btn ghost" data-cancel="${b.id}">Cancel</button></div>`;
        }
        const byAppt = (a, b) => a.date === b.date ? a.start - b.start : a.date < b.date ? -1 : 1;

        function wireCancel(el, refresh) {
            el.querySelectorAll('[data-cancel]').forEach(btn => btn.onclick = () => {
                if (!confirm('Cancel this appointment?')) return;
                save(load().filter(b => b.id !== btn.dataset.cancel));
                refresh();
                renderSlots();
            });
        }

        function renderMine() {
            const p = $('lookup').value.trim();
            const l = load().filter(b => b.phone === p).sort(byAppt);
            $('mineList').innerHTML = !p ? '' : l.length ? l.map(b => rowHtml(b, false)).join('') : '<div class="empty">No bookings found for that number.</div>';
            wireCancel($('mineList'), renderMine);
        }

        function renderAdmin() {
            const mode = $('sortBy').value,
                f = $('fDoc').value;
            const l = load().filter(b => f === 'all' || b.doctor === f).sort((a, b) =>
                mode === 'placedAsc' ? a.created - b.created : mode === 'apptAsc' ? byAppt(a, b) : b.created - a.created);
            $('adminList').innerHTML = l.length ? l.map(b => rowHtml(b, true)).join('') : '<div class="empty">No bookings yet.</div>';
            wireCancel($('adminList'), renderAdmin);
        }
        $('fDoc').innerHTML = '<option value="all">All doctors</option>' + DOCTORS.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
        $('fDoc').onchange = renderAdmin;
        $('sortBy').onchange = renderAdmin;
        $('find').onclick = renderMine;
        $('enter').onclick = () => {
            if ($('pin').value === ADMIN_PIN) {
                $('login').classList.add('hidden');
                $('panel').classList.remove('hidden');
                $('pinErr').textContent = '';
                renderAdmin()
            } else $('pinErr').textContent = 'Wrong PIN. Try again.';
        };
        $('wipe').onclick = () => {
            if (confirm('Delete every booking? This cannot be undone.')) {
                save([]);
                renderAdmin();
                renderSlots()
            }
        };

        /* ---------- Tabs ---------- */
        ['book', 'mine', 'admin'].forEach(k => $('t-' + k).onclick = () => {
            ['book', 'mine', 'admin'].forEach(x => {
                $('v-' + x).classList.toggle('hidden', x !== k);
                $('t-' + x).classList.toggle('on', x === k)
            });
            if (k === 'book') renderSlots();
        });

        renderDocs();
        renderDates();
        renderSlots();
    </script>
</body>

</html>
